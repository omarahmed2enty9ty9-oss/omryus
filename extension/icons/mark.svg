<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Omryus">
  <defs>
    <linearGradient id="ring" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#0E2138"/><stop offset="1" stop-color="#43596A"/>
    </linearGradient>
    <linearGradient id="crown" x1="0.1" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#5A6E7C"/><stop offset="1" stop-color="#3B4E5C"/>
    </linearGradient>
    <linearGradient id="brim" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#516A78"/><stop offset="1" stop-color="#3A4C5A"/>
    </linearGradient>
    <linearGradient id="spark" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFC461"/><stop offset="1" stop-color="#F09A12"/>
    </linearGradient>
  </defs>

  <!-- Lens and handle first, so the hat occludes the ring where it crosses. -->
  <circle cx="59" cy="68" r="27.8" fill="#F4F9FA"/>
  <path d="M64 55.5 Q66 65.5 76 68 Q66 70.5 64 80.5 Q62 70.5 52 68 Q62 65.5 64 55.5 Z" fill="url(#spark)"/>
  <circle cx="59" cy="68" r="27.3" fill="none" stroke="url(#ring)" stroke-width="15"/>
  <line x1="84" y1="93" x2="107" y2="116" stroke="#22394F" stroke-width="15" stroke-linecap="round"/>

  <!-- Hat: brim crosses the lens, crown sits up and to the left. -->
  <g transform="translate(-3 5) rotate(-19 54.45 46)">
    <path d="M24.5 49
             C24.5 31, 28 14, 38 12
             C43 11, 44 17.5, 47.5 19
             C52 21, 54 7, 62 7
             C74 7, 82 26, 82 49 Z" fill="url(#crown)"/>
    <path d="M24.6 24.5 C40 30, 66 31, 82 25.5 L82 41.5 L24.5 41.5 Z" fill="#0E2138"/>
    <rect x="5" y="40.4" width="99" height="11.5" rx="5.75" fill="url(#brim)"/>
  </g>
</svg>
