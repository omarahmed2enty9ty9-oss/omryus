<!doctype html><meta charset="utf-8"><title>Cart — Mock Store</title><link rel="stylesheet" href="style.css">
<nav><a href="/">← fixtures</a></nav>
<h1>Your basket</h1>
<div class="box"><p>1 × Test Widget</p><p class="total">Total: £50.00</p></div>
<div class="box">
  <label for="coupon">Discount code</label>
  <input id="coupon" name="coupon" autocomplete="off">
  <button name="apply-coupon">Apply</button>
  <p class="applied" id="out"></p>
</div>
<script>
  document.querySelector('[name=apply-coupon]').addEventListener('click', () => {
    const v = document.getElementById('coupon').value;
    document.getElementById('out').textContent = v ? `Code "${v}" accepted — 20% off.` : 'Enter a code.';
  });
</script>
